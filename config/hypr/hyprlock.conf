# ==============================================================================
# HYPRLOCK CLASSIC AESTHETIC CONFIGURATION
# Tailored for ASUS Vivobook with Nordic Twilight Theme & Custom Avatar
# ==============================================================================

general {
    disable_loading_bar = true
    hide_cursor = false
    grace = 2
    no_fade_in = false
}

# --- Background with Soft Ambient Blur ---
background {
    monitor =
    path = /home/raven/.local/share/backgrounds/hyprarch/current
    color = rgba(15, 23, 42, 1.0)

    # Ambient Depth Blur
    blur_passes = 2
    blur_size = 6
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
}

# --- Big Classic Digital Clock ---
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = rgba(248, 250, 252, 0.95)
    font_size = 76
    font_family = JetBrains Mono ExtraBold
    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgba(0, 0, 0, 0.4)
    position = 0, 240
    halign = center
    valign = center
}

# --- Classic Date Subtitle ---
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%A, %d %B %Y")"
    color = rgba(148, 163, 184, 0.9)
    font_size = 17
    font_family = Inter Medium
    shadow_passes = 1
    shadow_size = 2
    shadow_color = rgba(0, 0, 0, 0.3)
    position = 0, 175
    halign = center
    valign = center
}

# --- Custom Programmer Avatar Widget ---
image {
    monitor =
    path = /home/raven/.config/hypr/profile.jpg
    size = 135
    rounding = -1
    border_size = 3
    border_color = rgba(125, 211, 252, 0.85)
    rotate = 0
    reload_time = -1

    shadow_passes = 2
    shadow_size = 8
    shadow_color = rgba(0, 0, 0, 0.5)

    position = 0, 45
    halign = center
    valign = center
}

# --- User Welcome Prompt ---
label {
    monitor =
    text = Welcome back, $USER
    color = rgba(226, 232, 240, 0.85)
    font_size = 15
    font_family = Inter SemiBold
    position = 0, -50
    halign = center
    valign = center
}

# --- Translucent Frosted Glass Password Field ---
input-field {
    monitor =
    size = 280, 48
    outline_thickness = 2
    dots_size = 0.28
    dots_spacing = 0.25
    dots_center = true
    dots_rounding = -1
    outer_color = rgba(125, 211, 252, 0.6)
    inner_color = rgba(15, 23, 42, 0.65)
    font_color = rgb(248, 250, 252)
    fade_on_empty = false
    placeholder_text = <span foreground="##94a3b8"><i>Enter Password...</i></span>
    hide_input = false
    check_color = rgb(56, 189, 248)
    fail_color = rgb(248, 113, 113)
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    capslock_color = rgb(250, 204, 21)
    position = 0, -115
    halign = center
    valign = center
}

# --- Battery Indicator (Bottom Right) ---
label {
    monitor =
    text = cmd[update:5000] echo "⚡ $(cat /sys/class/power_supply/BAT1/capacity 2>/dev/null || cat /sys/class/power_supply/BAT0/capacity 2>/dev/null)%"
    color = rgba(148, 163, 184, 0.7)
    font_size = 12
    font_family = JetBrains Mono
    position = -30, 25
    halign = right
    valign = bottom
}

# --- Layout/Status Indicator (Bottom Left) ---
label {
    monitor =
    text = ASUS Vivobook 16 • HyprArch
    color = rgba(148, 163, 184, 0.5)
    font_size = 11
    font_family = Inter
    position = 30, 25
    halign = left
    valign = bottom
}
