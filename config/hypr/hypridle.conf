general {
    lock_cmd      = hyprlock
    before_sleep_cmd = hyprlock
    after_sleep_cmd  = hyprctl dispatch dpms on
    ignore_dbus_inhibit = false
}

# 4 min: dim the screen
listener {
    timeout    = 240
    on-timeout = ~/.local/bin/laptop-brightness down ; ~/.local/bin/laptop-brightness down
    on-resume  = ~/.local/bin/laptop-brightness up ; ~/.local/bin/laptop-brightness up
}

# 5 min: lock screen
listener {
    timeout    = 300
    on-timeout = hyprlock
    on-resume  = hyprctl dispatch dpms on
}

# 8 min: turn display off
listener {
    timeout    = 480
    on-timeout = hyprctl dispatch dpms off
    on-resume  = hyprctl dispatch dpms on
}

# 20 min: suspend system
listener {
    timeout    = 1200
    on-timeout = systemctl suspend
}
