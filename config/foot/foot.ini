# ==============================================================================
# FOOT TERMINAL - CLASSIC AESTHETIC CONFIGURATION
# Frosted Translucent Glassmorphism with Nordic & Sky-Blue Accents
# ==============================================================================

[main]
font=JetBrains Mono:size=11
pad=16x16
term=xterm-256color

[cursor]
style=beam
blink=yes

[colors-dark]
# 82% opacity allows the classic wallpaper to softly shine through with blur
alpha=0.82
foreground=f8fafc
background=0b1329

# Cursor text & background colors
cursor=0b1329 7dd3fc

# Regular Colors
regular0=1e293b
regular1=f87171
regular2=4ade80
regular3=facc15
regular4=38bdf8
regular5=c084fc
regular6=22d3ee
regular7=cbd5e1

# Bright Colors
bright0=475569
bright1=fca5a5
bright2=86efac
bright3=fde047
bright4=7dd3fc
bright5=d8b4fe
bright6=67e8f9
bright7=ffffff

[scrollback]
lines=10000
multiplier=3.0
indicator-position=none
